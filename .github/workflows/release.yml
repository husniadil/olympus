name: Release

# Tag-driven, and deliberately not reachable any other way. The version every
# door reports is stamped from the tag (api §7), so a release built from
# anything but a tag would publish binaries that lie about what they are.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version and the changelog from tag history.
          # A shallow clone gives it neither, and the failure is a wrong version
          # rather than an error.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A bare runner has no multiplexer at all, and the suite is built to SKIP
      # rather than fail when one is missing — so a gate here without these
      # would pass in seconds having driven no terminal, which is worse than no
      # gate because it looks like one. These are not continue-on-error for the
      # same reason: on a tag, a backend that cannot be installed should stop
      # the release, not quietly narrow what it proved.
      - name: Install the backends the gate needs
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y tmux
          tmux -V

          # Downloaded into RUNNER_TEMP, never the checkout: goreleaser refuses
          # to build from a dirty tree, and the first tag failed on exactly this
          # — an untracked zmx tarball sitting in the repo root.
          name="zmx-${ZMX_VERSION}-linux-x86_64.tar.gz"
          base="https://github.com/neurosnap/zmx/releases/download/v${ZMX_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$name" "$base/$name"
          cd "$RUNNER_TEMP"
          # Digest FIELD, not line: the published .sha256 names the file by the
          # build machine's own cache path. Same reason as in ci.yml.
          expected=$(curl -fsSL "$base/$name.sha256" | awk '{print $1}')
          actual=$(sha256sum "$name" | awk '{print $1}')
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: want $expected, got $actual"; exit 1; }
          mkdir -p "$HOME/.local/bin"
          tar xzf "$name" -C "$HOME/.local/bin" zmx
          chmod +x "$HOME/.local/bin/zmx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Pinned for the same reason as ci.yml, and it matters more here:
          # @latest makes the gate a release passed depend on whatever a third
          # party published that morning. Keep in step with ci.yml's newest leg.
          go install "github.com/garindra/meja@v${MEJA_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          # A bare prebuilt executable, pinned to a release tag. It publishes no
          # checksum file, so the version it reports below is the only evidence
          # the download is what it claims to be — stated rather than skipped
          # quietly.
          curl -fsSL -o "$HOME/.local/bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64"
          chmod +x "$HOME/.local/bin/herdr"
          herdr --version
        env:
          ZMX_VERSION: "0.7.0"
          MEJA_VERSION: "0.0.26"
          HERDR_VERSION: "0.8.2"

      # The gate is what CI runs on every push, and a tag is the one commit
      # where skipping it would be least forgivable.
      - name: Gate
        run: |
          for backend in tmux zmx meja herdr; do
            command -v "$backend" >/dev/null || { echo "$backend absent; the gate would skip its leg"; exit 1; }
          done
          make test-full

      # goreleaser builds only from a clean tree, and everything above it here
      # writes somewhere — packages, downloads, a Go build cache, the gate
      # driving real terminals. Naming that failure beats reading it out of a
      # goreleaser error at the end of a release run.
      - name: The tree the release is built from is clean
        run: |
          dirty=$(git status --porcelain)
          [ -z "$dirty" ] || { echo "the working tree is dirty:"; echo "$dirty"; exit 1; }

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned, not a range: the archive layout, the checksum file and the
          # generated changelog are all goreleaser's output, and a release
          # should be built by the same version a developer can run locally to
          # reproduce it. Bumping this is a deliberate edit.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

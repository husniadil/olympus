name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it, and the
# suite drives real terminals — these are not cheap minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · tmux ${{ matrix.tmux }} · zmx ${{ matrix.zmx }} · meja ${{ matrix.meja }}
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise burn the default six hours. This is not
    # hypothetical: `doctor` could hang forever on a backend binary that never
    # answered, and the local run that found it sat at 600s before anyone looked.
    # The full gate takes ~100s on a developer machine.
    timeout-minutes: 20
    strategy:
      # One backend or platform failing should not hide the others: the whole
      # point of the matrix is knowing WHICH combination broke.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tmux: [system]
        zmx: ["0.7.0"]
        meja: ["0.0.26"]
        include:
          # The floor is tmux 3.3, for allow-passthrough. Building it is only
          # worth the CI minutes on one platform.
          #
          # That leg carries the zmx floor too, so the two versions this repo
          # names — the oldest supported and the newest released — are each
          # exercised somewhere rather than only the one a developer happens to
          # have installed.
          - os: ubuntu-latest
            tmux: "3.3"
            zmx: "0.6.0"
            meja: "0.0.25"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux (system)
        if: matrix.tmux == 'system'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Build tmux ${{ matrix.tmux }} (the version floor)
        if: matrix.tmux != 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${{ matrix.tmux }}/tmux-${{ matrix.tmux }}.tar.gz" | tar xz
          cd "tmux-${{ matrix.tmux }}" && ./configure && make -j"$(nproc)" && sudo make install
          tmux -V

      # meja installs from source with the Go toolchain already set up above, so
      # unlike zmx it CAN be covered here. It is allowed to fail: a third-party
      # module that stops building must not take the whole gate with it, and the
      # backend's own tests skip loudly when it is absent.
      #
      # PINNED, not @latest. @latest silently moved this leg from 0.0.25 to
      # 0.0.26, and that release changed the backend STRUCTURALLY — ordinary
      # input stopped requiring an attached client (§2.10). A gate whose
      # subject can change without a commit is not a gate, and the floor leg
      # below is what keeps the transient-client path exercised at all once the
      # newest release no longer takes it.
      - name: Install meja
        continue-on-error: true
        run: |
          go install "github.com/garindra/meja@v${{ matrix.meja }}"
          # setup-go is documented to add this, but this workflow has never run
          # and a silent PATH assumption would show up as "meja absent" rather
          # than as the mistake it is.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Note the meja leg
        run: |
          if meja version >/dev/null 2>&1; then
            echo "meja present: $(meja version | head -1)"
          else
            echo "::warning::meja could not be installed on this runner; its conformance leg is SKIPPED, not passing"
          fi

      # zmx is not in any runner's package manager, but it publishes a prebuilt
      # binary per platform — and the two it builds are exactly the two this
      # matrix runs on. Without this the DEFAULT backend was the only one CI
      # never touched, which is the worst possible one to leave unproven.
      #
      # Allowed to fail, like meja: a third-party download that breaks must not
      # take the gate with it, and the leg below says plainly when it is absent.
      - name: Install zmx ${{ matrix.zmx }}
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) platform=macos ;;
            Linux) platform=linux ;;
          esac
          case "$(uname -m)" in
            arm64 | aarch64) arch=aarch64 ;;
            x86_64) arch=x86_64 ;;
          esac
          # Into RUNNER_TEMP, not the checkout: an untracked tarball in the repo
          # root is a dirty tree, which is harmless here but broke the first
          # release tag outright. Same reason both places, so same handling.
          name="zmx-${{ matrix.zmx }}-${platform}-${arch}.tar.gz"
          base="https://github.com/neurosnap/zmx/releases/download/v${{ matrix.zmx }}"
          curl -fsSL -o "$RUNNER_TEMP/$name" "$base/$name"
          cd "$RUNNER_TEMP"

          # Compare the digest FIELD, not the line: the published .sha256 names
          # the file by the build machine's own cache path, so `-c` would look
          # for ./.zig-cache/o/<hash>/... and fail on a file that is fine.
          expected=$(curl -fsSL "$base/$name.sha256" | awk '{print $1}')
          if [ "$RUNNER_OS" = "macOS" ]; then
            actual=$(shasum -a 256 "$name" | awk '{print $1}')
          else
            actual=$(sha256sum "$name" | awk '{print $1}')
          fi
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: want $expected, got $actual"; exit 1; }

          mkdir -p "$HOME/.local/bin"
          tar xzf "$name" -C "$HOME/.local/bin" zmx
          chmod +x "$HOME/.local/bin/zmx"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # CI must never be read as having covered zmx when it did not: on PATH and
      # runnable are separate questions, and the version call answers the second.
      - name: Note the zmx leg
        run: |
          if command -v zmx >/dev/null 2>&1; then
            echo "zmx present: $(zmx version | head -1)"
          else
            echo "::warning::zmx is not installed on this runner; its conformance leg is SKIPPED, not passing"
          fi

      # test-full, NOT test. The gate was split so `make test` could be run on
      # every edit in seconds, which means it deliberately skips every case that
      # drives a real terminal — the conformance suite included. CI running it
      # would be CI proving almost nothing, on a runner that exists to run
      # exactly those cases.
      - name: Gate
        run: make test-full

  vet:
    name: format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

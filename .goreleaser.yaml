version: 2

# Olympus drives a multiplexer rather than embedding one, so the release carries
# only the binary: the backends are the user's own installation, which is why
# `olympus doctor` exists and why every unavailable-backend error points at it.

before:
  hooks:
    - go mod tidy
    # NOT into dist/. before-hooks run before goreleaser prepares the
    # distribution directory, so writing there makes dist non-empty and the run
    # aborts with "dist is not empty" — even with --clean, because the clean
    # happens after these. Found by actually running it; reading the file does
    # not show the ordering.
    - go run ./tools/gendoc .gendoc

builds:
  - id: olympus
    main: ./cmd/olympus
    binary: olympus
    env: [CGO_ENABLED=0]
    # macOS and Linux only. The PTY handling, the termios work and the socket
    # semantics are POSIX; a Windows build would compile into something that
    # cannot do the job.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # The version is STAMPED, not compiled in. Version is the literal every door
    # reports and the one a consumer floor-checks against (api §7); without this
    # every published binary reports the development placeholder in version.go,
    # whatever tag it was cut from.
    ldflags:
      - -s -w
      - -X github.com/husniadil/olympus.Version={{ .Version }}
    # Reproducible archives: without this the binary carries its build time and
    # two builds of one tag differ.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: .gendoc/man/*
        dst: man
      - src: .gendoc/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
